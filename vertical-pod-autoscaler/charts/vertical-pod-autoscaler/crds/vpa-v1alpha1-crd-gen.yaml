                          type: number
                      type: object
                    totalSamplesCount:
                      description: Total number of samples in the histograms.
                      type: integer
                  required:
                  - containerName
                  type: object
                type: array
              lastUpdateTime:
                description: The time when the status was last refreshed.
                format: date-time
