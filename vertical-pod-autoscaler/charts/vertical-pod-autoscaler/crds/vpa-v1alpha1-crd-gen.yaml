apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes/kubernetes/pull/63797
    controller-gen.kubebuilder.io/version: v0.21.0
  name: verticalpodautoscalerslicecheckpoints.autoscaling.k8s.io
spec:
  group: autoscaling.k8s.io
  names:
    kind: VerticalPodAutoscalerSliceCheckpoint
    listKind: VerticalPodAutoscalerSliceCheckpointList
    plural: verticalpodautoscalerslicecheckpoints
    shortNames:
    - vpaslicecheckpoint
    singular: verticalpodautoscalerslicecheckpoint
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          VerticalPodAutoscalerSliceCheckpoint is the checkpoint of the internal state
          of VPA for a single VPASlice. It stores per-container histogram data scoped
          to the pods on nodes matching the slice's nodeSelector, enabling recovery
          of per-node-group recommender state after a restart.

          Unlike VerticalPodAutoscalerCheckpoint (which stores one container per object),
          a slice checkpoint packs all containers into a single object, yielding one
          checkpoint per VPASlice regardless of container count.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Specification of the slice checkpoint.
            properties:
              vpaObjectName:
                description: VPAObjectName is the name of the parent VerticalPodAutoscaler.
                type: string
              vpaSliceName:
                description: |-
                  VPASliceName is the name of the VerticalPodAutoscalerSlice this
                  checkpoint belongs to.
                type: string
            type: object
          status:
            description: Data of the slice checkpoint.
            properties:
              containerCheckpoints:
                description: ContainerCheckpoints holds histogram data for each container
                  in the slice.
                items:
                  description: ContainerHistogramCheckpoint holds histogram data for
                    a single container.
                  properties:
                    containerName:
                      description: Name of the container.
                      type: string
                    cpuHistogram:
                      description: Checkpoint of histogram for consumption of CPU.
                      properties:
                        bucketWeights:
                          description: Map from bucket index to bucket weight.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        referenceTimestamp:
                          description: Reference timestamp for samples collected within
                            this histogram.
                          format: date-time
                          nullable: true
                          type: string
                        totalWeight:
                          description: Sum of samples to be used as denominator for
                            weights from BucketWeights.
                          type: number
                      type: object
                    firstSampleStart:
                      description: Timestamp of the first sample from the histograms.
                      format: date-time
                      nullable: true
                      type: string
                    lastSampleStart:
                      description: Timestamp of the last sample from the histograms.
                      format: date-time
                      nullable: true
                      type: string
                    memoryHistogram:
                      description: Checkpoint of histogram for consumption of memory.
                      properties:
                        bucketWeights:
                          description: Map from bucket index to bucket weight.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        referenceTimestamp:
                          description: Reference timestamp for samples collected within
                            this histogram.
                          format: date-time
                          nullable: true
                          type: string
                        totalWeight:
                          description: Sum of samples to be used as denominator for
                            weights from BucketWeights.
                          type: number
                      type: object
                    totalSamplesCount:
                      description: Total number of samples in the histograms.
                      type: integer
                  required:
                  - containerName
                  type: object
                type: array
              lastUpdateTime:
                description: The time when the status was last refreshed.
                format: date-time
                nullable: true
                type: string
              version:
                description: Version of the format of the stored data.
                type: string
            type: object
        type: object
    served: true
    storage: true
