          metadata:
            type: object
          spec:
            description: Specification identifying which pods this slice covers.
            properties:
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector identifies the set of nodes this slice covers.
                  Pods running on nodes whose labels match ALL entries in this map
                  will use this slice's recommendations.

                  Typically contains a single key-value pair derived from the parent
                  VPA's spec.sliceByNodeLabel field (e.g. {"node.kubernetes.io/instance-type": "m5.xlarge"}).
                type: object
              vpaName:
                description: |-
                  VPAName is the name of the parent VerticalPodAutoscaler object.
                  The VPASlice must be in the same namespace as the parent VPA.
                  The recommender sets an ownerReference on the VPASlice pointing to
                  the parent VPA for garbage collection.
                type: string
            required:
            - nodeSelector
            - vpaName
            type: object
          status:
            description: Computed recommendations for pods on matching nodes.
            properties:
              conditions:
                description: |-
                  Conditions is the set of conditions for this slice, indicating whether
                  a recommendation could be computed.
                items:
                  description: |-
                    VerticalPodAutoscalerCondition describes the state of
                    a VerticalPodAutoscaler at a certain point.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from
                        one status to another
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human-readable explanation containing details about
                        the transition
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason is the reason for the condition's last transition.
                      type: string
                    status:
                      description: status is the status of the condition (True, False,
                        Unknown)
                      type: string
                    type:
                      description: type describes the current condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  recommender for this slice.
                format: int64
                minimum: 0
                type: integer
              recommendation:
                description: |-
                  Recommendation is the most recently computed resource recommendation
                  for containers of pods running on nodes matching this slice's selector.
                  Reuses the same RecommendedPodResources type as VerticalPodAutoscalerStatus.
                properties:
                  containerRecommendations:
                    description: Resources recommended by the autoscaler for each
                      container.
                    items:
                      description: |-
                        RecommendedContainerResources is the recommendation of resources computed by
                        autoscaler for a specific container. Respects the container resource policy
                        if present in the spec. In particular the recommendation is not produced for
                        containers with `ContainerScalingMode` set to 'Off'.
                      properties:
                        containerName:
                          description: Name of the container.
                          type: string
                        lowerBound:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Minimum recommended amount of resources. Observes ContainerResourcePolicy.
                            This amount is not guaranteed to be sufficient for the application to operate in a stable way, however
                            running with less resources is likely to have significant impact on performance/availability.
                          type: object
                        target:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: Recommended amount of resources. Observes ContainerResourcePolicy.
                          type: object
                        uncappedTarget:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            The most recent recommended resources target computed by the autoscaler
                            for the controlled pods, based only on actual resource usage, not taking
                            into account the ContainerResourcePolicy.
                            May differ from the Recommendation if the actual resource usage causes
                            the target to violate the ContainerResourcePolicy (lower than MinAllowed
                            or higher that MaxAllowed).
                            Used only as status indication, will not affect actual resource assignment.
                          type: object
                        upperBound:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Maximum recommended amount of resources. Observes ContainerResourcePolicy.
                            Any resources allocated beyond this value are likely wasted. This value may be larger than the maximum
                            amount of application is actually capable of consuming.
                          type: object
                      required:
                      - target
                      type: object
                    type: array
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.vpaName
